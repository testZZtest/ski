name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a GitHub release on tags

jobs:
  # ski-run's translation of each agent's output, on recorded runs (linux/test/run.sh); jq comes with the runner
  helper-tests:
    name: Helper tests (ski-run fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the helper on recorded agent output
        run: bash linux/test/run.sh

  apk:
    name: APK (ski.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # proot, talloc, libandroid-shmem and the pty helper, from source with a fixed NDK
      - name: Build native libraries (proot, pty)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" native/build.sh
        env:
          NDK_VERSION: 27.2.12479018

      # Release signing is optional: add the SKI_KEYSTORE_BASE64 and SKI_KEYSTORE_PASSWORD
      # repository secrets to get a signed APK; otherwise the APK is unsigned.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SKI_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SKI_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SKI_KEYSTORE_PASSWORD: ${{ secrets.SKI_KEYSTORE_PASSWORD }}
          SKI_KEY_ALIAS: ${{ secrets.SKI_KEY_ALIAS }}
          SKI_KEY_PASSWORD: ${{ secrets.SKI_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleGithubRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          apk=$(find app/build/outputs/apk/github/release -name '*.apk' | head -1)
          cp "$apk" dist/ski.apk
          echo "## Build result" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK:** \`ski.apk\` ($(du -h dist/ski.apk | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Signed:** $([ -n "$SKI_KEYSTORE" ] && echo yes || echo no — artifact only)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** $(grep -oE 'VERSION = "[^"]+"' app/src/main/java/ski/agent/BuildInfo.java | cut -d'"' -f2)" >> "$GITHUB_STEP_SUMMARY"
          ls -l dist

      # On main (and manual runs): the APK goes, as a plain file, to the dist branch —
      # https://github.com/testZZtest/ski/raw/dist/ski.apk always downloads the newest build,
      # no zip around it. Signed or not: an unsigned APK still installs from "unknown sources".
      - name: Publish APK to the dist branch
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the payload goes in a file: the base64 APK (~4 MB) is too long for an argument list,
          # jq builds the JSON (proper escaping) into a file for --input
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/contents/ski.apk?ref=dist" --jq .sha 2>/dev/null || true)
          B64=$(base64 -w0 dist/ski.apk)
          jq -n --arg sha "$GITHUB_SHA" --arg existing "$EXISTING" --rawfile content <(base64 -w0 dist/ski.apk) '{message: ("ski.apk from " + $sha), content: $content, branch: "dist"} + (if $existing != "" then {sha: $existing} else {} end)' > /tmp/payload.json
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/ski.apk" --input /tmp/payload.json --jq .commit.sha
          echo "APK published: https://github.com/$GITHUB_REPOSITORY/raw/dist/ski.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact (kept 30 days)
        uses: actions/upload-artifact@v7
        with:
          name: ski-apk
          path: dist/ski.apk
          retention-days: 30

      # An unsigned APK cannot be installed over a signed one, so a tag only publishes a release when the key is set.
      - name: Check signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SKI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No SKI_KEYSTORE_BASE64 secret: the APK is unsigned, so no release is published. Add SKI_KEYSTORE_BASE64 and SKI_KEYSTORE_PASSWORD (see README) and re-run this tag's workflow."
          fi

      # A tag attaches the APK to a GitHub release: ski.apk (fixed name, what the in-app updater
      # and Obtainium use) and ski-<tag>.apk.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/ski.apk "dist/ski-${GITHUB_REF_NAME}.apk"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk --title "Ski $GITHUB_REF_NAME" --generate-notes --latest
          fi
